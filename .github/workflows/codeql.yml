name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Kotlin and Java
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Create Gradle properties from safe template
        run: cp gradle.properties.example gradle.properties
      - name: Build and test Android sources
        run: bash gradlew "-Pandroid.useAndroidX=true" :shared:testDebugUnitTest :app:assembleDebug
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
