name: Android

on:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Create Gradle properties from safe template
        run: cp gradle.properties.example gradle.properties
      - name: Run shared tests and assemble Android debug APK
        run: bash gradlew "-Pandroid.useAndroidX=true" :shared:testDebugUnitTest :app:assembleDebug
